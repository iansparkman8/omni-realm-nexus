<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Code Canvas Lite</title>
<meta name="theme-color" content="#14161c">
<style>
  :root { --bg:#14161c; --panel:#1b1e26; --line:#2a2f3b; --ink:#e6e8ee; --muted:#8b93a7; --acc:#7cc4ff; --err:#ff8a7a; --ok:#8fe0a8; }
  * { box-sizing:border-box; }
  html, body { height:100%; margin:0; }
  body { display:flex; flex-direction:column; font:14px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; background:var(--bg); color:var(--ink); }
  header { display:flex; align-items:center; gap:8px; padding:8px 12px; border-bottom:1px solid var(--line); flex-wrap:wrap; }
  header b { font-size:15px; margin-right:8px; letter-spacing:.02em; }
  select, button, input { font:inherit; color:var(--ink); background:var(--panel); border:1px solid var(--line); border-radius:6px; padding:6px 10px; }
  button { cursor:pointer; } button.pri { background:var(--acc); color:#0b1220; border-color:var(--acc); font-weight:600; }
  label.auto { display:flex; align-items:center; gap:6px; color:var(--muted); }
  .grow { flex:1; }
  main { flex:1; display:grid; grid-template-columns:1fr 1fr; min-height:0; }
  @media (max-width:760px) { main { grid-template-columns:1fr; grid-template-rows:1fr 1fr; } }
  .ed { position:relative; display:flex; min-height:0; border-right:1px solid var(--line); }
  .gut { padding:10px 6px; text-align:right; color:#4b5266; font:13px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace; user-select:none; overflow:hidden; white-space:pre; min-width:38px; }
  textarea { flex:1; resize:none; border:0; outline:0; padding:10px; background:transparent; color:var(--ink); font:13px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace; tab-size:2; white-space:pre; overflow:auto; }
  .view { position:relative; min-height:0; background:#000; }
  iframe { position:absolute; inset:0; width:100%; height:100%; border:0; background:#000; }
  footer { display:flex; gap:10px; align-items:center; padding:6px 12px; border-top:1px solid var(--line); font:12px ui-monospace,monospace; min-height:30px; }
  #status.err { color:var(--err); } #status.ok { color:var(--ok); }
  .muted { color:var(--muted); }
</style>
</head>
<body>
<header>
  <b>Code Canvas Lite</b>
  <select id="tpl" aria-label="Template"></select>
  <button class="pri" id="run" title="Run (Ctrl+Enter)">Run</button>
  <label class="auto"><input type="checkbox" id="auto" checked> auto-run</label>
  <span class="grow"></span>
  <input id="name" placeholder="Snippet name" maxlength="40" size="14">
  <button id="save">Save</button>
  <select id="snips" aria-label="Saved snippets"><option value="">Saved…</option></select>
  <button id="delete" title="Delete the selected snippet">Delete</button>
</header>
<main>
  <div class="ed"><div class="gut" id="gut">1</div><textarea id="code" spellcheck="false" autocapitalize="off" autocomplete="off" aria-label="Code"></textarea></div>
  <div class="view"><iframe id="frame" sandbox="allow-scripts" title="Preview"></iframe></div>
</main>
<footer><span id="status" class="muted">Ready.</span><span class="grow"></span><span class="muted">Your code runs in a sandbox with no network. Snippets stay in this browser.</span></footer>
<script>
(() => {
  const $ = id => document.getElementById(id);
  const TEMPLATES = {
    'three-cube': { kind: 'js', name: 'Three.js: spinning cube', code:
`import * as THREE from 'three';

const renderer = new THREE.WebGLRenderer({ antialias: true });
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(50, 1, 0.1, 100);
camera.position.set(2.5, 2, 3.5); camera.lookAt(0, 0, 0);

const cube = new THREE.Mesh(new THREE.BoxGeometry(1, 1, 1), new THREE.MeshStandardMaterial({ color: 0x7cc4ff, roughness: 0.4 }));
scene.add(cube, new THREE.HemisphereLight(0xffffff, 0x223344, 1.2));
const sun = new THREE.DirectionalLight(0xffffff, 2); sun.position.set(3, 4, 2); scene.add(sun);

function resize() { renderer.setSize(innerWidth, innerHeight); camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); }
addEventListener('resize', resize); resize();
renderer.setAnimationLoop(t => { cube.rotation.x = t / 1400; cube.rotation.y = t / 900; renderer.render(scene, camera); });
` },
    'frag-waves': { kind: 'glsl', name: 'Fragment shader: colour waves', code:
`// uniforms provided: float uTime (seconds), vec2 uRes (pixels)
precision highp float;
uniform float uTime;
uniform vec2 uRes;

void main() {
  vec2 uv = (gl_FragCoord.xy - 0.5 * uRes) / uRes.y;
  float d = length(uv);
  float w = sin(10.0 * d - uTime * 2.0) * 0.5 + 0.5;
  vec3 col = mix(vec3(0.05, 0.08, 0.15), vec3(0.49, 0.77, 1.0), w * smoothstep(0.9, 0.0, d));
  gl_FragColor = vec4(col, 1.0);
}
` }
  };
  for (const [k, t] of Object.entries(TEMPLATES)) $('tpl').add(new Option(t.name, k));

  // three.js is vendored and handed to the sandbox as a data: URL in an import map, so the preview needs no network
  let threeURL = null;
  const threeReady = fetch('vendor/three.module.min.js').then(r => r.text()).then(src => { threeURL = 'data:text/javascript;base64,' + btoa(unescape(encodeURIComponent(src))); }).catch(() => {});

  const CSP = "default-src 'none'; script-src 'unsafe-inline' data:; style-src 'unsafe-inline'; img-src data: blob:";
  const REPORT = `<script>
    const send = (type, msg, line) => parent.postMessage({ ccl: 1, type, msg: String(msg), line: line || 0 }, '*');
    addEventListener('error', e => send('error', e.message, e.lineno));
    addEventListener('unhandledrejection', e => send('error', e.reason && e.reason.message || e.reason));
    setTimeout(() => send('ok', 'Running.'), 300);
  <\/script>`;
  function docFor(kind, code) {
    const head = '<!DOCTYPE html><html><head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="' + CSP + '">'
      + '<style>html,body{margin:0;height:100%;overflow:hidden;background:#000}canvas{display:block;width:100%;height:100%}</style>' + REPORT;
    if (kind === 'glsl') return head + '</head><body><canvas id="c"></canvas><script>(' + glslRunner.toString() + ')(' + JSON.stringify(code) + ');<\/script></body></html>';
    const map = threeURL ? '<script type="importmap">' + JSON.stringify({ imports: { three: threeURL } }) + '<\/script>' : '';
    return head + map + '</head><body><script type="module">\n' + code.replace(/<\/script/gi, '<\\/script') + '\n<\/script></body></html>';
  }
  // runs inside the sandbox: a full-screen triangle drawn with the user's fragment shader
  function glslRunner(fs) {
    const c = document.getElementById('c'), gl = c.getContext('webgl');
    const fail = m => parent.postMessage({ ccl: 1, type: 'error', msg: m, line: (/0:(\d+)/.exec(m) || [])[1] | 0 }, '*');
    if (!gl) return fail('WebGL is not available here.');
    const sh = (type, src) => { const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s); if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) { fail(gl.getShaderInfoLog(s)); return null; } return s; };
    const vs = sh(gl.VERTEX_SHADER, 'attribute vec2 p; void main(){ gl_Position = vec4(p, 0.0, 1.0); }'), f = sh(gl.FRAGMENT_SHADER, fs);
    if (!vs || !f) return;
    const pr = gl.createProgram(); gl.attachShader(pr, vs); gl.attachShader(pr, f); gl.linkProgram(pr);
    if (!gl.getProgramParameter(pr, gl.LINK_STATUS)) return fail(gl.getProgramInfoLog(pr));
    gl.useProgram(pr); gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer()); gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
    const loc = gl.getAttribLocation(pr, 'p'); gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
    const uT = gl.getUniformLocation(pr, 'uTime'), uR = gl.getUniformLocation(pr, 'uRes'), t0 = performance.now();
    (function frame() { c.width = innerWidth; c.height = innerHeight; gl.viewport(0, 0, c.width, c.height); gl.uniform1f(uT, (performance.now() - t0) / 1000); gl.uniform2f(uR, c.width, c.height); gl.drawArrays(gl.TRIANGLES, 0, 3); requestAnimationFrame(frame); })();
  }

  let kind = 'js';
  const status = (m, cls) => { $('status').textContent = m; $('status').className = cls || 'muted'; };
  async function run() {
    await threeReady;
    status('Running…');
    $('frame').srcdoc = docFor(kind, $('code').value);
  }
  addEventListener('message', e => {
    if (e.source !== $('frame').contentWindow || !e.data || !e.data.ccl) return;
    if (e.data.type === 'error') status('Error' + (e.data.line ? ' (line ' + e.data.line + ')' : '') + ': ' + e.data.msg.split('\n')[0], 'err');
    else if (!/^Error/.test($('status').textContent)) status(e.data.msg, 'ok');
  });

  // editor: line numbers, tab inserts two spaces, Ctrl/Cmd+Enter runs, auto-run after a pause
  const gutter = () => { const n = $('code').value.split('\n').length; $('gut').textContent = Array.from({ length: n }, (_, i) => i + 1).join('\n'); $('gut').scrollTop = $('code').scrollTop; };
  let timer = 0;
  $('code').addEventListener('input', () => { gutter(); if ($('auto').checked) { clearTimeout(timer); timer = setTimeout(run, 700); } });
  $('code').addEventListener('scroll', () => { $('gut').scrollTop = $('code').scrollTop; });
  $('code').addEventListener('keydown', e => {
    if (e.key === 'Tab') { e.preventDefault(); const t = e.target, s = t.selectionStart; t.setRangeText('  ', s, t.selectionEnd, 'end'); gutter(); }
    if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); run(); }
  });
  $('run').addEventListener('click', run);
  const load = (k, code) => { kind = k; $('code').value = code; gutter(); run(); };
  $('tpl').addEventListener('change', () => { const t = TEMPLATES[$('tpl').value]; load(t.kind, t.code); });

  // snippets in localStorage (falls back to memory if storage is unavailable)
  let mem = {};
  const getAll = () => { try { return JSON.parse(localStorage.getItem('ccl-snippets') || '{}'); } catch (e) { return mem; } };
  const setAll = o => { mem = o; try { localStorage.setItem('ccl-snippets', JSON.stringify(o)); } catch (e) { } };
  function listSnips() { const s = $('snips'), all = getAll(); s.length = 1; for (const k of Object.keys(all).sort()) s.add(new Option(k, k)); }
  $('save').addEventListener('click', () => { const n = $('name').value.trim() || 'Untitled'; const all = getAll(); all[n] = { kind, code: $('code').value, at: Date.now() }; setAll(all); listSnips(); $('snips').value = n; status('Saved "' + n + '".', 'ok'); });
  $('snips').addEventListener('change', () => { const all = getAll(), s = all[$('snips').value]; if (s) { $('name').value = $('snips').value; load(s.kind, s.code); } });
  $('delete').addEventListener('click', () => { const k = $('snips').value; if (!k) return; const all = getAll(); delete all[k]; setAll(all); listSnips(); status('Deleted "' + k + '".'); });

  listSnips();
  const t = TEMPLATES['three-cube']; load(t.kind, t.code);
})();
</script>
</body>
</html>
